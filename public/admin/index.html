<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>سكن — مركز التحكم</title>
<style>
/* ═══════════════ الرموز ═══════════════ */
:root{
  --ink:#0e1520; --ink-2:#151f2e; --ink-3:#1d2a3d; --line:#26364c;
  --paper:#f4f7fb; --mute:#7d8fa8; --text:#dbe6f2; --text-2:#9fb2c9;
  --ok:#2fbf71; --warn:#e8a33d; --bad:#e5544b; --info:#4aa3e0; --gold:#c9a227;
  --r:6px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ar:"Segoe UI","Noto Sans Arabic","Tahoma",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--ar);font-size:14px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--info)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3d55;border-radius:9px}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══════════════ الدخول ═══════════════ */
#gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:80;padding:20px}
.gate-box{width:100%;max-width:420px;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:28px}
.gate-box h1{margin:0 0 4px;font-size:22px;letter-spacing:-.5px}
.gate-box p.sub{margin:0 0 22px;color:var(--mute);font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:5px;font-size:12px;color:var(--text-2)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--info)}
.btn{padding:8px 15px;background:var(--ink-3);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:background .12s}
.btn:hover{background:#25344a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--info);border-color:var(--info);color:#06121d;font-weight:600}
.btn.primary:hover{background:#63b2e8}
.btn.ok{background:transparent;border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:rgba(47,191,113,.12)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.bad:hover{background:rgba(229,84,75,.12)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.wide{width:100%;justify-content:center}
.err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:18px}

/* ═══════════════ الهيكل ═══════════════ */
#app{display:none;grid-template-columns:212px 1fr;height:100vh}
#app.on{display:grid}
aside{background:var(--ink-2);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand b{font-size:17px;letter-spacing:-.4px}
.brand span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
nav{padding:8px 0;flex:1}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;color:var(--text-2);
  text-decoration:none;font-size:13.5px;border-right:2px solid transparent;cursor:pointer}
nav a:hover{background:var(--ink-3);color:var(--text)}
nav a.on{background:var(--ink-3);color:#fff;border-right-color:var(--info)}
nav .grp{padding:12px 16px 4px;font-size:10.5px;color:#5c6e86;letter-spacing:.6px}
.pill{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--ink);border:1px solid var(--line);
  font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pill.hot{background:rgba(229,84,75,.16);border-color:var(--bad);color:#ff8b83}
.pill.warm{background:rgba(232,163,61,.16);border-color:var(--warn);color:#f0bd6d}
.who{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.who b{color:var(--text);display:block;font-size:13px}

main{overflow-y:auto;padding:20px 24px 60px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.head h2{margin:0;font-size:20px;letter-spacing:-.4px}
.head .note{color:var(--mute);font-size:12.5px}

/* ═══════════════ عناصر ═══════════════ */
.grid{display:grid;gap:12px}
.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--text-2);font-weight:600}
.kpi .lab{font-size:11.5px;color:var(--mute);margin-bottom:4px}
.kpi .val{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.kpi .sub{font-size:11.5px;color:var(--mute);margin-top:2px}
.kpi.alert{border-color:var(--bad)} .kpi.alert .val{color:#ff8b83}
.kpi.warn{border-color:var(--warn)} .kpi.warn .val{color:#f0bd6d}

.bar{height:7px;background:var(--ink);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
.spark{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:6px}
.spark div{flex:1;background:var(--ink-3);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.spark div.a{background:var(--info)}
.spark div:hover::after{content:attr(data-t);position:absolute;bottom:100%;right:50%;transform:translateX(50%);
  background:#000;padding:3px 6px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:5}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:8px 10px;color:var(--mute);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--ink-2);z-index:2;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #1c2838;vertical-align:middle}
tbody tr:hover{background:#182234;cursor:pointer}
.tw{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 230px)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.ref{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:15px}

.tag{display:inline-block;padding:1px 8px;border-radius:11px;font-size:11.5px;border:1px solid var(--line);background:var(--ink);white-space:nowrap}
.t-published,.t-collected,.t-rented,.t-field,.t-actioned{border-color:var(--ok);color:var(--ok)}
.t-pending,.t-due,.t-new,.t-reserved,.t-desk,.t-investigating,.t-forwarded{border-color:var(--warn);color:var(--warn)}
.t-rejected,.t-open,.t-dead,.t-lost{border-color:var(--bad);color:var(--bad)}
.t-expired,.t-none,.t-draft,.t-waived,.t-dismissed,.t-closed{border-color:var(--line);color:var(--mute)}
.t-owner_responded,.t-viewing_set{border-color:var(--info);color:var(--info)}
.lv{display:inline-flex;gap:2px;vertical-align:middle}
.lv i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.lv i.f{background:var(--gold)}

.bars{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bars input,.bars select{padding:6px 10px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.bars input[type=search]{min-width:200px}
.chip{padding:5px 11px;border:1px solid var(--line);border-radius:14px;background:var(--ink-2);cursor:pointer;font-size:12.5px}
.chip.on{background:var(--info);border-color:var(--info);color:#06121d;font-weight:600}

/* ═══════════════ الدرج ═══════════════ */
#drawer{position:fixed;inset:0;background:rgba(4,8,14,.68);display:none;z-index:60}
#drawer.on{display:block}
.dpanel{position:absolute;inset-block:0;inset-inline-start:0;width:min(560px,100%);background:var(--ink-2);
  border-inline-end:1px solid var(--line);overflow-y:auto;padding:20px 22px 40px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.dhead h3{margin:0;font-size:18px;letter-spacing:-.3px}
.dl{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:13px;margin:12px 0}
.dl dt{color:var(--mute)}
.dl dd{margin:0}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sec h4{margin:0 0 10px;font-size:12.5px;color:var(--text-2)}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--ok)}
.phone{font-family:var(--mono);font-size:14px;color:var(--gold)}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imgs img{width:76px;height:58px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}

#toast{position:fixed;inset-block-end:20px;inset-inline-start:20px;z-index:90;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--ink-3);border:1px solid var(--line);border-inline-start:3px solid var(--info);
  border-radius:var(--r);padding:10px 14px;font-size:13px;max-width:340px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.tst.ok{border-inline-start-color:var(--ok)} .tst.bad{border-inline-start-color:var(--bad)}
.tst.warn{border-inline-start-color:var(--warn)}

.warnbox{background:rgba(232,163,61,.09);border:1px solid rgba(232,163,61,.4);border-radius:var(--r);
  padding:9px 12px;font-size:12.5px;color:#f0bd6d;margin-bottom:12px}
.feed{max-height:calc(100vh - 220px);overflow-y:auto}
.fitem{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid #1c2838;font-size:13px}
.fitem .ts{color:var(--mute);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:96px}
.fitem .who2{color:var(--gold);font-size:12px;min-width:70px}

@media(max-width:820px){
  #app.on{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{flex-direction:row;align-items:center;overflow-x:auto;border-inline:0;border-bottom:1px solid var(--line)}
  .brand,.who{display:none}
  nav{display:flex;padding:0}
  nav .grp{display:none}
  nav a{border-right:0;border-bottom:2px solid transparent;white-space:nowrap}
  nav a.on{border-bottom-color:var(--info)}
  main{padding:14px}
}
</style>
</head>
<body>

<!-- ═══════════════ بوابة الدخول ═══════════════ -->
<div id="gate">
  <div class="gate-box">
    <h1>سكن — مركز التحكم</h1>
    <p class="sub">سجّل دخول بحساب الطاقم. الاسم والدور بيجوا من القاعدة تلقائياً.</p>
    <div class="field">
      <label for="gEmail">الإيميل أو اسم المستخدم</label>
      <input id="gEmail" type="text" autocomplete="username" placeholder="name@example.com أو اسم المستخدم">
    </div>
    <div class="field">
      <label for="gPass">كلمة السر</label>
      <input id="gPass" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary wide" id="gbtn">دخول</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<!-- ═══════════════ التطبيق ═══════════════ -->
<div id="app">
  <aside>
    <div class="brand"><b>سكن</b><span>مركز التحكم</span></div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="drawer"><div class="dpanel" id="dpanel"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   سكن — لوحة الإدارة
   صفحة واحدة · vanilla JS · بدون أي حزم خارجية
   ممنوع كتابة أي مفتاح هنا. المفتاح بينلصق يدوياً وبينحفظ بـsessionStorage.
   ══════════════════════════════════════════════════════════ */

const SUPA = "https://yckteijitcqjtedoyoyv.supabase.co";
const REST = SUPA + "/rest/v1";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlja3RlaWppdGNxanRlZG95b3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MjA3MTksImV4cCI6MjEwMzQ5NjcxOX0.mAY5A6ROvtxN4kkD8g1s_tsDlSjGfy4TCNkgbYHeRvo";

const S = { token:"", refresh:"", exp:0, actor:"", role:"agent", view:"dash", page:"privacy", cache:{}, filters:{} };

/* ── الشبكة ───────────────────────────────────────────── */
function hdr(extra){
  return Object.assign({ apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+S.token,
                         "Content-Type":"application/json" }, extra||{});
}
async function get(path, count){
  const r = await fetch(REST+path, { headers: hdr(count ? {Prefer:"count=exact"} : null) });
  if(!r.ok) throw new Error(await errText(r));
  const data = await r.json();
  if(count){
    const cr = r.headers.get("content-range")||"";
    data.__total = parseInt(cr.split("/")[1],10) || data.length;
  }
  return data;
}
async function rpc(name, body){
  const r = await fetch(REST+"/rpc/"+name, { method:"POST", headers:hdr(), body:JSON.stringify(body||{}) });
  if(!r.ok) throw new Error(await errText(r));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function patch(table, filter, body){
  const r = await fetch(REST+"/"+table+"?"+filter, { method:"PATCH",
    headers: hdr({Prefer:"return=representation"}), body:JSON.stringify(body) });
  if(!r.ok) throw new Error(await errText(r));
  return r.json();
}
async function post(table, body){
  const r = await fetch(REST+"/"+table, { method:"POST",
    headers: hdr({Prefer:"return=representation"}), body:JSON.stringify(body) });
  if(!r.ok) throw new Error(await errText(r));
  return r.json();
}
async function del(table, filter){
  const r = await fetch(REST+"/"+table+"?"+filter, { method:"DELETE", headers:hdr() });
  if(!r.ok) throw new Error(await errText(r));
}
async function errText(r){
  let m = "";
  try { const j = await r.json(); m = j.message || j.hint || j.details || ""; } catch(e){}
  if(r.status===401) return "المفتاح مرفوض — تأكد إنه مفتاح الخدمة مش المفتاح العام.";
  if(r.status===403) return "المفتاح سليم بس الدور ما إله صلاحية. "+m;
  if(r.status===404) return "المسار مش موجود — غالباً الكاش ما تحدّث. "+m;
  return (m || ("خطأ "+r.status));
}

/* ── أدوات ────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => n==null ? "—" : Number(n).toLocaleString("en-US");
const money = n => n==null ? "—" : Number(n).toLocaleString("en-US",{maximumFractionDigits:0})+" ₪";

function dt(s, withTime){
  if(!s) return "—";
  const d = new Date(s);
  const p = n => String(n).padStart(2,"0");
  const base = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  return withTime ? base+" "+p(d.getHours())+":"+p(d.getMinutes()) : base;
}
function ago(s){
  if(!s) return "—";
  const m = Math.floor((Date.now()-new Date(s))/60000);
  if(m<1) return "الآن";
  if(m<60) return "قبل "+m+" د";
  if(m<1440) return "قبل "+Math.floor(m/60)+" س";
  const d = Math.floor(m/1440);
  return d<30 ? "قبل "+d+" يوم" : dt(s);
}
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "tst "+(kind||"");
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function tag(v, dict){ return v==null ? "—" : '<span class="tag t-'+esc(v)+'">'+esc((dict&&dict[v])||v)+"</span>"; }
function lvl(n){
  n = n||0;
  let h = '<span class="lv" title="مستوى التوثيق '+n+'/4">';
  for(let i=1;i<=4;i++) h += '<i class="'+(i<=n?"f":"")+'"></i>';
  return h+"</span>";
}
function q(obj){
  return Object.entries(obj).filter(([,v])=>v!=null&&v!=="").map(([k,v])=>k+"="+v).join("&");
}

/* ── القواميس ─────────────────────────────────────────── */
const L_STATUS = {draft:"مسودّة",pending:"بانتظار المراجعة",published:"منشور",rejected:"مرفوض",
                  reserved:"محجوز",rented:"مؤجّر",expired:"منتهي"};
const L_VERIF  = {none:"غير موثّق",desk:"توثيق مكتبي",field:"توثيق ميداني"};
const L_KIND   = {room_shared:"غرفة بسكن مشترك",bed_shared:"سرير بغرفة مشتركة",
                  studio:"ستوديو",apartment:"شقة",family:"سكن عائلي"};
const L_POL    = {female:"إناث فقط",male:"ذكور فقط",mixed:"مختلط"};
const C_STATUS = {new:"جديد",forwarded:"محوّل للمالك",owner_responded:"المالك ردّ",
                  viewing_set:"معاينة محدّدة",rented:"تم التأجير",dead:"مغلق"};
const R_STATUS = {open:"مفتوح",investigating:"قيد التحقيق",actioned:"تم التصرّف",dismissed:"مرفوض"};
const R_CAT    = {fake_listing:"إعلان وهمي",already_rented:"مؤجّر أصلاً",harassment:"تحرّش",
                  entered_room:"دخول الغرفة بدون إذن",deposit:"نزاع تأمين",camera:"كاميرا داخلية",other:"أخرى"};
const F_STATUS = {due:"مستحق",collected:"محصّل",waived:"معفى",lost:"ضائع"};
const REJECTS  = ["صور مش مطابقة للواقع","السعر غير واقعي","الرقم ما بيرد / رقم غلط",
                  "المالك انسحب","تكرار إعلان موجود","معلومات ناقصة","مخالف لشروط السلامة"];

/* ── الأقسام والصلاحيات ───────────────────────────────── */
const VIEWS = [
  {id:"dash",    t:"لوحة القيادة",   grp:"التشغيل اليومي", both:true},
  {id:"queue",   t:"بانتظار المراجعة", grp:"", both:true, badge:"pending"},
  {id:"requests",t:"طلبات الباحثين",   grp:"", both:true, badge:"reqs"},
  {id:"reports", t:"البلاغات",        grp:"", both:false, badge:"reports"},
  {id:"pipeline",t:"مسار التأجير",     grp:"", both:true},
  {id:"listings",t:"كل الإعلانات",    grp:"المخزون", both:true},
  {id:"verify",  t:"التوثيق",         grp:"", both:true},
  {id:"matches", t:"المطابقة العكسية", grp:"", both:true},
  {id:"owners",  t:"الملّاك",          grp:"الناس", both:true},
  {id:"seekers", t:"الباحثون",        grp:"", both:false},
  {id:"fees",    t:"الرسوم",          grp:"المال", both:true, badge:"fees"},
  {id:"activity",t:"نشاط المنصة",     grp:"السجلات", both:false},
  {id:"audit",   t:"سجل الإجراءات",   grp:"", both:false},
  {id:"settings",t:"الإعدادات",       grp:"", both:false},
  {id:"pages",   t:"صفحات المحتوى",   grp:"", both:false}
];
const isAdmin = () => S.role === "admin";
const can = v => v.both || isAdmin();

/* ── الدخول (Supabase Auth) ──────────────────────────── */
let refreshTimer = null;

$("#gbtn").addEventListener("click", enter);
["gEmail","gPass"].forEach(id => $("#"+id).addEventListener("keydown", e => { if(e.key==="Enter") enter(); }));

function setSession(token, refresh, expiresIn){
  S.token = token; S.refresh = refresh; S.exp = Date.now() + expiresIn*1000;
  sessionStorage.setItem("sakan_token", token);
  sessionStorage.setItem("sakan_refresh", refresh);
  sessionStorage.setItem("sakan_exp", String(S.exp));
}

async function loadIdentity(){
  S.actor = await rpc("actor_name");
  S.role  = (await rpc("is_admin")) ? "admin" : "agent";
}

function scheduleRefresh(){
  if(refreshTimer) clearTimeout(refreshTimer);
  const wait = Math.max(5000, S.exp - Date.now() - 60000);
  refreshTimer = setTimeout(async () => {
    try { await refreshToken(); scheduleRefresh(); }
    catch(e){ doLogout("انتهت الجلسة — سجّل دخول من جديد."); }
  }, wait);
}

async function refreshToken(){
  const r = await fetch(SUPA+"/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token:S.refresh })
  });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description||j.msg||"فشل تجديد الجلسة.");
  setSession(j.access_token, j.refresh_token, j.expires_in);
}

const BIDI_CODES = [0x200B,0x200C,0x200D,0x200E,0x200F,0x202A,0x202B,0x202C,0x202D,0x202E,0x2066,0x2067,0x2068,0x2069,0xFEFF];
const BIDI_MARKS = new RegExp("[" + BIDI_CODES.map(c => String.fromCharCode(c)).join("") + "]", "g");
function stripBidi(s){ return s.replace(BIDI_MARKS, ""); }

async function resolveEmail(idOrEmail){
  if(idOrEmail.includes("@")) return idOrEmail;
  const r = await fetch(REST+"/rpc/staff_email_for_username", {
    method:"POST",
    headers:{ apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ p_username:idOrEmail })
  });
  const t = await r.text();
  if(!r.ok) throw new Error("تعذّر التحقق (كود "+r.status+"): "+t.slice(0,150));
  if(!t) throw new Error("اسم المستخدم مش موجود [رد فاضي — status "+r.status+"].");
  try { return JSON.parse(t); }
  catch(e){ throw new Error("رد غير متوقّع من الخادم: "+t.slice(0,150)); }
}

async function enter(){
  const raw = stripBidi($("#gEmail").value.trim()), pass = $("#gPass").value;
  if(!raw || !pass) return ($("#gerr").textContent = "الإيميل أو اسم المستخدم وكلمة السر مطلوبين.");
  $("#gerr").textContent = "بيتحقّق…";
  $("#gbtn").disabled = true;
  try{
    const email = await resolveEmail(raw);
    if(!email) throw new Error("اسم المستخدم مش موجود.");
    const r = await fetch(SUPA+"/auth/v1/token?grant_type=password", {
      method:"POST", headers:{ apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ email, password:pass })
    });
    const j = await r.json();
    if(!r.ok){ console.error("login failed", r.status, j); throw new Error(j.error_description||j.msg||"الإيميل أو كلمة السر غلط."); }
    setSession(j.access_token, j.refresh_token, j.expires_in);
    await loadIdentity();
    scheduleRefresh();
    boot();
  } catch(e){
    $("#gerr").textContent = e.message;
  } finally {
    $("#gbtn").disabled = false;
  }
}

function showGate(msg){
  $("#app").classList.remove("on");
  $("#gate").style.display = "grid";
  $("#gerr").textContent = msg||"";
}

async function doLogout(msg){
  if(refreshTimer) clearTimeout(refreshTimer);
  const tok = S.token;
  sessionStorage.clear();
  S.token=""; S.refresh=""; S.exp=0; S.actor=""; S.role="agent";
  if(tok){
    try{ await fetch(SUPA+"/auth/v1/logout", {method:"POST",
      headers:{ apikey:SUPABASE_ANON_KEY, Authorization:"Bearer "+tok }}); } catch(e){}
  }
  showGate(msg);
}
function logout(){ doLogout(); }

async function init(){
  const t = sessionStorage.getItem("sakan_token"), rf = sessionStorage.getItem("sakan_refresh");
  const exp = +sessionStorage.getItem("sakan_exp") || 0;
  if(!t || !rf) return $("#gEmail").focus();
  S.token = t; S.refresh = rf; S.exp = exp;
  try{
    if(Date.now() > S.exp - 60000) await refreshToken();
    await loadIdentity();
    scheduleRefresh();
    boot();
  } catch(e){
    doLogout("انتهت الجلسة — سجّل دخول من جديد.");
  }
}

function buildNav(){
  let h = "", lastGrp = null;
  VIEWS.filter(can).forEach(v => {
    if(v.grp && v.grp !== lastGrp){ h += '<div class="grp">'+esc(v.grp)+"</div>"; lastGrp = v.grp; }
    h += '<a data-v="'+v.id+'">'+esc(v.t)+(v.badge?'<span class="pill" id="b-'+v.badge+'"></span>':"")+"</a>";
  });
  $("#nav").innerHTML = h;
  $("#nav").querySelectorAll("a").forEach(a => a.onclick = () => go(a.dataset.v));
}
function go(v){
  if(!VIEWS.some(x => x.id===v && can(x))) v = "dash";
  S.view = v; location.hash = v;
  $("#nav").querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.v===v));
  ({dash:vDash,queue:vQueue,requests:vRequests,listings:vListings,reports:vReports,
    pipeline:vPipeline,verify:vVerify,owners:vOwners,seekers:vSeekers,fees:vFees,
    matches:vMatches,activity:vActivity,audit:vAudit,settings:vSettings,
    pages:vPages}[v])();

async function rejectFlow(id){
  const opts = REJECTS.map((r,i)=>(i+1)+". "+r).join("\n");
  const pick = prompt("سبب الرفض — اكتب رقم أو نص حر:\n\n"+opts);
  if(pick===null) return;
  const n = parseInt(pick,10);
  const reason = (n>=1 && n<=REJECTS.length) ? REJECTS[n-1] : pick.trim();
  if(!reason) return toast("لازم سبب.", "bad");
  await setStatus(id, "rejected", reason);
}

function feedRow(a){

          "صلاحية الإعلان" بتنطبّق عند النشر أو التمديد الجاي.
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <h3>أكواد الخصم</h3>
        <table><thead><tr><th>الكود</th><th>الخصم</th><th>الحد</th><th>استُخدم</th><th>حتى</th><th>فعّال</th><th></th></tr></thead>
        <tbody>${promos.map(p=>`<tr style="cursor:default">
          <td class="ref">${esc(p.code)}</td>
          <td class="num">${p.discount_pct}٪</td>
          <td class="num">${p.max_uses==null?"∞":p.max_uses}</td>
          <td class="num">${p.used_count}</td>
          <td>${dt(p.valid_until)}</td>

          <td><button class="btn sm" data-pt="${esc(p.code)}" data-on="${p.is_active}">${p.is_active?"إيقاف":"تفعيل"}</button></td>
        </tr>`).join("")}</tbody></table>
        <div class="bars" style="margin-top:12px">
          <input id="npc" placeholder="الكود" style="width:130px">
          <input id="npd" type="number" placeholder="٪ الخصم" style="width:100px">
          <input id="npm" type="number" placeholder="حد الاستخدام" style="width:130px">
          <input id="npu" type="date" style="width:150px">
          <button class="btn sm primary" id="addPromo">إضافة كود</button>
        </div>
      </div>

      <div class="card">
        <h3>المدن والمناطق</h3>
        <table><thead><tr><th>المدينة</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${cities.map(c=>{

              <button class="btn sm" data-ct="${c.id}" data-nm="${esc(c.name_ar)}"

                ${!c.is_active&&a.filter(x=>x.is_active).length===0?"disabled title='ضيف منطقة مفعّلة قبل التفعيل'":""}>
                ${c.is_active?"تعطيل":"تفعيل"}</button>
            </td>
          </tr>`;}).join("")}</tbody></table>

        <div class="bars" style="margin-top:12px">
          <input id="ncn" placeholder="اسم المدينة بالعربي" style="width:190px">
          <input id="ncs" placeholder="slug بالإنجليزي" style="width:150px">
          <button class="btn sm primary" id="addCity">إضافة مدينة</button>
        </div>

        <h3 style="margin-top:18px">المناطق</h3>
        <table><thead><tr><th>المنطقة</th><th>المدينة</th><th>الترتيب</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${areas.map(a=>{
          const c = cities.find(x=>x.id===a.city_id) || {};
          return `<tr style="cursor:default">
            <td>${esc(a.name_ar)} <span class="ref">${esc(a.slug)}</span></td>
            <td>${esc(c.name_ar||"—")}</td>
            <td class="num">${a.sort_order}</td>
            <td>${a.is_active!==false?'<span class="tag t-published">مفعّلة</span>':'<span class="tag t-expired">معطّلة</span>'}</td>
            <td><button class="btn sm" data-at="${a.id}" data-city="${a.city_id}"
                  data-nm="${esc(a.name_ar)}" data-sl="${esc(a.slug)}"
                  data-so="${a.sort_order}" data-on="${a.is_active!==false}">
                  ${a.is_active!==false?"تعطيل":"تفعيل"}</button></td>
          </tr>`;}).join("")}</tbody></table>

        <div class="bars" style="margin-top:12px">
          <select id="nac" style="width:170px">
            ${cities.map(c=>`<option value="${c.id}">${esc(c.name_ar)}</option>`).join("")}</select>
          <input id="nan" placeholder="اسم المنطقة بالعربي" style="width:190px">
          <input id="nas" placeholder="slug بالإنجليزي" style="width:150px">
          <input id="nao" type="number" placeholder="ترتيب" style="width:90px">
          <button class="btn sm primary" id="addArea">إضافة منطقة</button>
        </div>

        <div class="warnbox" style="margin:12px 0 0">
          تفعيل مدينة أو منطقة بيفتحها فوراً بالموقع العام وبنموذج الإعلان.
          لا تفعّل مدينة قبل ما يكون فيها مندوب يقدر يزور.
          التعطيل ما بيمسح الإعلانات القديمة — بس بيمنع إعلانات جديدة عليها.
        </div>
      </div>`;

    $("#main").querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
      const k = b.dataset.save;
      const inp = $("#main").querySelector('.setv[data-k="'+CSS.escape(k)+'"]');
      const raw = inp.value.trim();
      let val;
      if(inp.dataset.kind==="number"){ if(isNaN(+raw)) return toast("لازم رقم.", "bad"); val = +raw; }
      else if(inp.dataset.kind==="bool"){ val = (raw==="true"||raw==="نعم"); }
      else val = raw;
      try{
        await rpc("admin_set_setting", {p_key:k, p_value:val});
        toast("انحفظ الإعداد.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    });

    $("#main").querySelectorAll("[data-pt]").forEach(b => b.onclick = async () => {
      try{
        await patch("promo_codes", "code=eq."+encodeURIComponent(b.dataset.pt), {is_active: b.dataset.on!=="true"});
        await rpc("admin_log", {p_action:"promo_toggle", p_subject_type:"promo",
          p_subject_ref:b.dataset.pt, p_reason:b.dataset.on==="true"?"إيقاف":"تفعيل"});
        toast("تحدّث الكود.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    });

    $("#addPromo").onclick = async () => {
      const code = $("#npc").value.trim().toUpperCase(), d = +$("#npd").value;
      if(!code || !(d>0 && d<=100)) return toast("بدنا كود ونسبة خصم بين ١ و١٠٠.", "bad");
      try{
        await post("promo_codes", {code, discount_pct:d,
          max_uses: $("#npm").value ? +$("#npm").value : null,
          valid_until: $("#npu").value || null, is_active:true});
        await rpc("admin_log", {p_action:"promo_create", p_subject_type:"promo",
          p_subject_ref:code, p_reason:d+"٪"});
        toast("انضاف الكود.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    };

    /* التبديل صار عبر admin_city_save/admin_area_save: التعديل والتسجيل
       بالسجل بيصيروا بمعاملة وحدة. قبل هيك كان PATCH مباشر + admin_log
       منفصل — لو الثاني فشل بيصير تعديل بدون أثر بالسجل. */
    const slugOk = s => /^[a-z0-9][a-z0-9-]*$/.test(s);

    $("#main").querySelectorAll("[data-ct]").forEach(b => b.onclick = async () => {
      const on = b.dataset.on !== "true";
      if(!on && !confirm("تعطيل المدينة بيخفيها من الموقع العام ونموذج الإعلان. متأكد؟")) return;
      try{
        await rpc("admin_city_save", {p_id:+b.dataset.ct, p_name:b.dataset.nm,
          p_slug:b.dataset.sl, p_active:on});
        toast("تحدّثت المدينة.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    });

    $("#main").querySelectorAll("[data-at]").forEach(b => b.onclick = async () => {
      const on = b.dataset.on !== "true";
      if(!on && !confirm("تعطيل المنطقة بيمنع إعلانات جديدة عليها. متأكد؟")) return;
      try{
        await rpc("admin_area_save", {p_id:+b.dataset.at, p_city:+b.dataset.city,
          p_name:b.dataset.nm, p_slug:b.dataset.sl, p_sort:+b.dataset.so,
          p_active:on});
        toast("تحدّثت المنطقة.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    });

    $("#addCity").onclick = async () => {
      const n = $("#ncn").value.trim(), s = $("#ncs").value.trim().toLowerCase();
      if(n.length < 2) return toast("اكتب اسم المدينة.", "bad");
      if(!slugOk(s)) return toast("الـslug لازم يكون حروف إنجليزية صغيرة وأرقام وشرطات.", "bad");
      try{
        await rpc("admin_city_save", {p_id:null, p_name:n, p_slug:s,
          p_active:false});
        toast("انضافت المدينة — معطّلة. ضيف مناطق ثم فعّلها.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    };

    $("#addArea").onclick = async () => {
      const n = $("#nan").value.trim(), s = $("#nas").value.trim().toLowerCase();
      const city = +$("#nac").value, so = $("#nao").value ? +$("#nao").value : 100;
      if(!city) return toast("اختر المدينة.", "bad");
      if(n.length < 2) return toast("اكتب اسم المنطقة.", "bad");
      if(!slugOk(s)) return toast("الـslug لازم يكون حروف إنجليزية صغيرة وأرقام وشرطات.", "bad");
      try{
        await rpc("admin_area_save", {p_id:null, p_city:city, p_name:n, p_slug:s,
          p_sort:so, p_active:true});
        toast("انضافت المنطقة.", "ok"); vSettings();
      } catch(e){ toast(e.message, "bad"); }
    };
  } catch(e){ fail(e); }
}

          <code>-</code> نقطة · <code>---</code> فاصل · وجداول بـ<code>|</code>.
          أي HTML بينكتب هون بينعرض كنص عادي مش ككود — الصفحة بتهرب كل شي.
          <br><b>تنبيه:</b> سياسة الخصوصية مستند قانوني. لا تشيل بند إلا وأنت متأكد إنه ما عاد ينطبق.
        </div>
      </div>` : '<div class="empty"><b>ما في صفحات</b>شغّل migration المحتوى أولاً.</div>'}`;

    $("#main").querySelectorAll("[data-pg]").forEach(b => b.onclick = () => {
      S.page = b.dataset.pg; vPages();
    });

    const sv = $("#pgSave");
    if(sv) sv.onclick = async () => {
      const body = $("#pgBody").value;
      if(body.trim().length < 20) return toast("النص قصير جداً.", "bad");
      sv.disabled = true;
      try{
        await rpc("admin_page_save", {p_key:d.key, p_title:$("#pgTitle").value.trim(),
          p_body:body, p_published:$("#pgPub").checked});
        toast("انحفظت الصفحة — صارت ظاهرة بالموقع.", "ok");
        S.page = d.key; vPages();
      } catch(e){ toast(e.message, "bad"); sv.disabled = false; }
    };
  } catch(e){ fail(e); }
}

/* ── الإقلاع ─────────────────────────────────────────── */
window.addEventListener("hashchange", () => { if(S.token) go(location.hash.slice(1)||"dash"); });
init();
</script>
</body>
</html>
